model = /mnt/ssd/llamacpp_models/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
parallel = 2
reasoning = on
temp = 1.0
top-p = 0.95
top-k = 64
ctx-size = 500000
mmproj = /mnt/ssd/llamacpp_models/mmproj/mmproj-F16_gemma4-26b.gguf

[General-Bot-large]
